<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Friendship Day ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Floating Hearts -->
    <div class="hearts">
        <span>❤️</span>
        <span>💙</span>
        <span>💜</span>
        <span>🤍</span>
        <span>💖</span>
        <span>💛</span>
        <span>💚</span>
        <span>🩵</span>
    </div>

    <!-- First Screen -->
    <div class="welcome" id="welcome">

        <h1>🎁</h1>

        <h2>I have a Surprise for you...</h2>

        <p>Click the button below ❤️</p>

        <button onclick="startSurprise()">
            Open Surprise
        </button>
        <audio id="bgMusic" loop>
    <source src="oh_my_friend.mp3" type="audio/mpeg">
</audio>

    </div>


    <!-- Surprise Screen -->

    <div class="surprise hidden" id="surprise">

        <h1 id="title">
            Happy Friendship Day
        </h1>

        <img src="https://i.postimg.cc/kMwVSqKx/Kavya-pic.jpg" id="photo">

        <h2 class="friend-name">
            Kavya...❤️
        </h2>      
          <p class="message">

            Hey Kavya....❤️

              You feels like this song:

              Thanatho Vundey, Okkakka Nimisham Marala Marala, Pudathava Manasa.
              

            

            ❤️ Happy Friendship Day ❤️

        </p>

    </div>



<script src="script.js"></script>

</body>
</html>
